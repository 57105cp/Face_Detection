<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1565C0">Face Detection Application - Flow Diagram</text>
  
  <!-- Client Section Background -->
  <rect x="30" y="70" width="540" height="800" rx="15" ry="15" fill="url(#clientGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565C0">CLIENT (React - Port 3000)</text>
  
  <!-- Server Section Background -->
  <rect x="630" y="70" width="540" height="800" rx="15" ry="15" fill="url(#serverGrad)" stroke="#388E3C" stroke-width="2"/>
  <text x="900" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E7D32">SERVER (Node.js - Port 5000)</text>
  
  <!-- CLIENT SIDE COMPONENTS -->
  
  <!-- 1. User Action -->
  <ellipse cx="300" cy="160" rx="100" ry="30" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E65100">User Clicks "Start Video"</text>
  
  <!-- 2. Webcam Access -->
  <rect x="180" y="220" width="240" height="50" rx="8" ry="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0">Request Webcam Access</text>
  <text x="300" y="262" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">navigator.mediaDevices.getUserMedia()</text>
  
  <!-- 3. Video Stream -->
  <rect x="180" y="300" width="240" height="50" rx="8" ry="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0">Video Stream Started</text>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">videoRef.current.srcObject = stream</text>
  
  <!-- 4. Capture Frame -->
  <rect x="180" y="380" width="240" height="60" rx="8" ry="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="405" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0">Capture Frame</text>
  <text x="300" y="420" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">ImageCapture.grabFrame()</text>
  <text x="300" y="432" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">canvas.toDataURL('image/png')</text>
  
  <!-- 5. Socket Emit -->
  <polygon points="300,470 380,510 300,550 220,510" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="507" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#01579B">Socket.IO</text>
  <text x="300" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#01579B">emit('frame')</text>
  
  <!-- 6. Receive Processed Frame -->
  <polygon points="300,690 380,730 300,770 220,730" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="727" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#01579B">Socket.IO</text>
  <text x="300" y="740" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#01579B">on('processedFrame')</text>
  
  <!-- 7. Display Results -->
  <rect x="130" y="800" width="340" height="60" rx="8" ry="8" fill="#fff" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="825" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1565C0">Display Results</text>
  <text x="300" y="840" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Render processed frame + face coordinates table</text>
  
  <!-- SERVER SIDE COMPONENTS -->
  
  <!-- 1. Socket Connection -->
  <polygon points="900,160 980,200 900,240 820,200" fill="#E8F5E9" stroke="#43A047" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="197" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1B5E20">Socket.IO</text>
  <text x="900" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1B5E20">on('connection')</text>
  
  <!-- 2. Load Model -->
  <rect x="750" y="270" width="300" height="60" rx="8" ry="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="295" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2E7D32">Load BlazeFace Model</text>
  <text x="900" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">modelLoader.js - blazeface.load()</text>
  <text x="900" y="322" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#888">(Loaded once, cached for reuse)</text>
  
  <!-- 3. Receive Frame -->
  <polygon points="900,360 980,400 900,440 820,400" fill="#E8F5E9" stroke="#43A047" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="397" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1B5E20">Socket.IO</text>
  <text x="900" y="410" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1B5E20">on('frame')</text>
  
  <!-- 4. Decode Base64 -->
  <rect x="750" y="470" width="300" height="50" rx="8" ry="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="495" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2E7D32">Decode Base64 Image</text>
  <text x="900" y="510" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Buffer.from(data, 'base64')</text>
  
  <!-- 5. Process Frame -->
  <rect x="750" y="550" width="300" height="80" rx="8" ry="8" fill="#FFF8E1" stroke="#FFC107" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#F57F17">Process Frame</text>
  <text x="900" y="592" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">frameProcessor.js</text>
  <text x="900" y="605" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">tf.browser.fromPixels(canvas)</text>
  <text x="900" y="618" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">model.estimateFaces(input)</text>
  
  <!-- 6. Face Detection Results -->
  <rect x="750" y="660" width="300" height="80" rx="8" ry="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="685" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2E7D32">Face Detection Results</text>
  <text x="900" y="702" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">" Bounding box (topLeft, bottomRight)</text>
  <text x="900" y="715" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">" Landmarks (eyes, nose, mouth, ears)</text>
  <text x="900" y="728" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">" Probability score</text>
  
  <!-- 7. Draw Annotations -->
  <rect x="750" y="770" width="300" height="50" rx="8" ry="8" fill="#fff" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="795" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2E7D32">Draw Annotations</text>
  <text x="900" y="810" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Bounding boxes (red) + Keypoints (green)</text>
  
  <!-- ARROWS - Client Side -->
  <line x1="300" y1="190" x2="300" y2="218" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="270" x2="300" y2="298" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="350" x2="300" y2="378" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="440" x2="300" y2="468" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="770" x2="300" y2="798" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ARROWS - Server Side -->
  <line x1="900" y1="240" x2="900" y2="268" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="330" x2="900" y2="358" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="440" x2="900" y2="468" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="520" x2="900" y2="548" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="630" x2="900" y2="658" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="740" x2="900" y2="768" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Cross-communication arrows -->
  <!-- Frame data to server -->
  <path d="M 380 510 Q 600 510 820 400" fill="none" stroke="#2196F3" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead-blue)"/>
  <text x="590" y="440" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1565C0">Base64 Frame Data</text>
  
  <!-- Processed frame back to client -->
  <path d="M 750 795 Q 600 795 380 730" fill="none" stroke="#4CAF50" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead-green)"/>
  <text x="570" y="785" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2E7D32">Processed Frame + Faces Data</text>
  
  <!-- Loop indicator for continuous streaming -->
  <path d="M 130 830 Q 80 830 80 610 Q 80 440 178 440" fill="none" stroke="#FF5722" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="60" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#E64A19" transform="rotate(-90, 60, 620)">Continuous Loop</text>
  
  <!-- Legend -->
  <rect x="30" y="880" width="1140" height="1" fill="#ccc"/>
  
</svg>
